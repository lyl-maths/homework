<!DOCTYPE html>
<html lang="zh-HANT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級功課記錄系統</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
      --accent-info: #f0f7ff;
      --base-font-size: 15px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--base-font-size);
      margin: 0; padding: 15px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      width: 96%; max-width: 1400px; margin: 0 auto;
      background: var(--card-bg); padding: 25px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .header-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; }
    h1 { color: var(--primary-color); margin: 0; font-size: 1.8em; }

    .header-btn-group { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn-action {
      padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 0.9em;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; border: none; color: white;
    }

    .btn-theme { background-color: #6f42c1; }
    .btn-sheet { background-color: #1d6f42; }
    .btn-stats { background-color: #d9480f; }
    .btn-tutorial { background-color: #319795; }
    .btn-reset { background-color: #dc3545; }

    .system-info-bar {
      background-color: var(--accent-info); border: 1px solid var(--border-color);
      padding: 12px 18px; border-radius: 8px; margin-bottom: 20px;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    }

    .copy-sys-link-btn {
      background-color: var(--primary-color); color: white; border: none;
      padding: 5px 12px; border-radius: 6px; font-size: 0.85em; cursor: pointer; font-weight: bold; margin-left: 10px;
    }

    .tab-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn {
      padding: 10px 24px; font-size: 1.1em; font-weight: bold;
      border: 2px solid var(--primary-color); background-color: var(--card-bg);
      color: var(--primary-color); border-radius: 8px; cursor: pointer; text-align: center; min-width: 90px;
    }
    .tab-btn.active { background-color: var(--primary-color); color: #fff; }

    .pending-card {
      background: #fff8e1; border: 1px solid #ffe082; padding: 15px; border-radius: 10px; margin-bottom: 20px;
    }
    .pending-row {
      display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #ffe082;
    }

    .form-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
      margin-bottom: 20px; background: var(--accent-info); padding: 20px;
      border-radius: 10px; border: 1px solid var(--border-color);
    }

    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: 1 / -1; }
    .form-group label { font-weight: bold; margin-bottom: 6px; font-size: 0.9em; }
    .form-group input { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; width: 100%; background: var(--card-bg); color: var(--text-color); }

    .type-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; align-items: center; min-height: 38px; }
    .type-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border: 1px solid var(--border-color); background-color: var(--card-bg);
      border-radius: 20px; font-size: 0.9em; cursor: pointer;
    }
    .type-badge.active { background-color: #28a745; color: #fff; border-color: #28a745; font-weight: bold; }
    .type-action-btn { font-size: 0.85em; cursor: pointer; opacity: 0.75; padding: 2px 4px; border-radius: 50%; }

    .add-type-btn {
      padding: 6px 14px; border: 1px dashed var(--primary-color); background-color: var(--card-bg);
      color: var(--primary-color); border-radius: 20px; cursor: pointer; font-size: 0.85em; font-weight: bold;
    }

    .student-list-header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
      margin-top: 25px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--primary-color);
    }

    .student-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-bottom: 1px solid var(--border-color); background: var(--card-bg);
    }

    .status-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .status-btn { padding: 6px 10px; border: 1px solid var(--border-color); background-color: var(--accent-info); border-radius: 4px; cursor: pointer; font-size: 0.85em; }
    .status-btn[data-status="全對"].active { background-color: #28a745; color: white; }
    .status-btn[data-status="欠日期"].active { background-color: #d97706; color: white; }
    .status-btn[data-status="要改正"].active { background-color: #ffc107; color: black; }
    .status-btn[data-status="欠改正"].active { background-color: #e65100; color: white; }
    .status-btn[data-status="欠交"].active { background-color: #dc3545; color: white; }
    .status-btn[data-status="缺席"].active { background-color: #6c757d; color: white; }
    .status-btn[data-status="申請延期"].active { background-color: #6f42c1; color: white; }

    .submit-box { margin-top: 30px; text-align: center; }
    .submit-btn { background-color: var(--primary-color); color: white; border: none; padding: 14px 40px; font-size: 1.1em; font-weight: bold; border-radius: 30px; cursor: pointer; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-box {
      background: var(--card-bg); color: var(--text-color); padding: 25px; border-radius: 12px; width: 90%; max-width: 450px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2); border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>📚 班級功課記錄系統</h1>
      <div class="header-btn-group">
        <button class="btn-action btn-theme" onclick="openThemeModal()">🎨 個人化介面</button>
        <button class="btn-action btn-sheet" onclick="openGoogleSheet()">📊 專屬 Google Sheet</button>
        <button class="btn-action btn-stats" onclick="navigateToPage('stats.html')">📊 欠交日數統計</button>
        <button class="btn-action btn-tutorial" onclick="navigateToPage('tutorial.html')">📖 建立範本與教學</button>
        <button class="btn-action btn-reset" onclick="resetSystem()">🔄 重置系統</button>
      </div>
    </div>

    <div class="system-info-bar">
      <div>
        🏫 學年：<strong id="displayYear">2026-2027</strong> | 
        👨‍🏫 老師代號：<strong id="displayTeacher">-</strong>
        <button class="copy-sys-link-btn" onclick="copySystemUrl()">🔗 複製專屬 Link</button>
      </div>
      <div>
        📘 當前科目：
        <select id="subjectSelect" onchange="onSubjectChange()" style="padding: 6px 12px; font-weight: bold; border-radius: 6px; background:var(--card-bg); color:var(--text-color);">
          <option value="">(載入中...)</option>
        </select>
      </div>
    </div>

    <div class="tab-group" id="classTabGroup"></div>

    <!-- 舊功課跟進區塊 -->
    <div class="pending-card" id="pendingCard" style="display:none;">
      <h3 style="margin-top:0; color:#b78103;">🔍 待跟進之改正/補交項目 (過往紀錄)</h3>
      <div id="pendingListContainer"></div>
    </div>

    <h3>📝 今日新功課記錄</h3>
    <div class="form-grid">
      <div class="form-group">
        <label for="issueDate">派發日期：</label>
        <input type="date" id="issueDate">
      </div>
      <div class="form-group">
        <label for="checkDate">批改日期：</label>
        <input type="date" id="checkDate">
      </div>
      <div class="form-group">
        <label for="pages">頁數/題數：</label>
        <input type="text" id="pages" placeholder="例：p.12-13 或 Q1-Q5">
      </div>
      <div class="form-group">
        <label for="questions">功課細項：</label>
        <input type="text" id="questions" placeholder="例：工作紙(一) 或 /">
      </div>

      <div class="form-group full-width">
        <label>功課種類 (點擊選擇，點擊 ✏️ 修改，❌ 刪除)：</label>
        <div class="type-buttons" id="typeButtons"></div>
      </div>
    </div>

    <div class="student-list-header">
      <h3>學生提交狀態 (當前科目：<span id="currentSubjectText" style="color:var(--primary-color);">-</span> | 班別：<span id="currentClassText" style="color:var(--primary-color);">-</span> | 功課：<span id="currentTypeText" style="color:#28a745;">-</span>)</h3>
      <div>
        <button onclick="fetchInitialData()">🔄 重新整理名單</button>
        <button onclick="setAllStatus('全對')">全部設為「全對」</button>
      </div>
    </div>

    <div id="studentContainer"></div>

    <div class="submit-box">
      <button class="submit-btn" id="submitBtn" onclick="submitHomework()">儲存新功課至 Google Sheets</button>
    </div>
  </div>

  <!-- 個人化設定 Modal -->
  <div class="modal-overlay" id="themeModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0;">🎨 個人化介面設定</h3>
        <span onclick="closeThemeModal()" style="cursor:pointer; font-weight:bold;">✕</span>
      </div>
      <div class="form-group" style="margin-bottom:15px;">
        <label for="themeSelect">選取主題風格：</label>
        <select id="themeSelect" style="padding:8px; border-radius:6px; margin-top:5px;">
          <option value="default">預設藍 (Default Blue)</option>
          <option value="dark">深色模式 (Dark Mode)</option>
          <option value="forest">森林綠 (Forest Green)</option>
          <option value="purple">優雅紫 (Elegant Purple)</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <label for="fontSizeSelect">選取字型大小：</label>
        <select id="fontSizeSelect" style="padding:8px; border-radius:6px; margin-top:5px;">
          <option value="15px">標準 (15px)</option>
          <option value="17px">中等 (17px)</option>
          <option value="19px">大 (19px)</option>
        </select>
      </div>
      <button onclick="saveThemeSettings()" style="width:100%; padding:10px; background:var(--primary-color); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">💾 儲存並套用設定</button>
    </div>
  </div>

  <script>
    function applySavedTheme() {
      const theme = localStorage.getItem('homework_theme') || 'default';
      const fontSize = localStorage.getItem('homework_font_size') || '15px';
      const root = document.documentElement;

      root.style.setProperty('--base-font-size', fontSize);

      if (theme === 'dark') {
        root.style.setProperty('--primary-color', '#4dabf7');
        root.style.setProperty('--bg-color', '#121212');
        root.style.setProperty('--card-bg', '#1e1e1e');
        root.style.setProperty('--text-color', '#e0e0e0');
        root.style.setProperty('--border-color', '#444444');
        root.style.setProperty('--accent-info', '#2a2a2a');
      } else if (theme === 'forest') {
        root.style.setProperty('--primary-color', '#2e7d32');
        root.style.setProperty('--bg-color', '#f1f8e9');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--text-color', '#1b5e20');
        root.style.setProperty('--border-color', '#c8e6c9');
        root.style.setProperty('--accent-info', '#e8f5e9');
      } else if (theme === 'purple') {
        root.style.setProperty('--primary-color', '#6f42c1');
        root.style.setProperty('--bg-color', '#f3e8ff');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--text-color', '#3b0764');
        root.style.setProperty('--border-color', '#d8b4fe');
        root.style.setProperty('--accent-info', '#faf5ff');
      } else {
        root.style.setProperty('--primary-color', '#0056b3');
        root.style.setProperty('--bg-color', '#f4f7f9');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--text-color', '#333333');
        root.style.setProperty('--border-color', '#cccccc');
        root.style.setProperty('--accent-info', '#f0f7ff');
      }
    }

    function openThemeModal() {
      document.getElementById('themeSelect').value = localStorage.getItem('homework_theme') || 'default';
      document.getElementById('fontSizeSelect').value = localStorage.getItem('homework_font_size') || '15px';
      document.getElementById('themeModal').style.display = 'flex';
    }

    function closeThemeModal() {
      document.getElementById('themeModal').style.display = 'none';
    }

    function saveThemeSettings() {
      const theme = document.getElementById('themeSelect').value;
      const fontSize = document.getElementById('fontSizeSelect').value;
      localStorage.setItem('homework_theme', theme);
      localStorage.setItem('homework_font_size', fontSize);
      applySavedTheme();
      closeThemeModal();
    }

    function navigateToPage(targetPage) {
      const currentPath = window.location.pathname;
      const directory = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
      window.location.href = window.location.origin + directory + targetPage;
    }

    function openGoogleSheet() {
      const sheetUrl = localStorage.getItem('homework_sheet_url');
      if (sheetUrl && sheetUrl.startsWith('http')) {
        window.open(sheetUrl, '_blank');
      } else {
        alert('⚠️ 尚未獲取專屬 Google Sheet 網址！\n請確認是否已設定正確的 Web App URL。');
      }
    }

    function resetSystem() {
      if (confirm('⚠️ 確定要重置系統嗎？這將會清除本地端的設定檔。')) {
        localStorage.clear();
        alert('🧹 系統已成功重置！');
        navigateToPage('index.html');
      }
    }

    function checkAndImportUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('api')) localStorage.setItem('homework_system_api_url', urlParams.get('api'));
      if (urlParams.get('year')) localStorage.setItem('homework_academic_year', urlParams.get('year'));
      if (urlParams.get('teacher')) localStorage.setItem('homework_teacher_code', urlParams.get('teacher'));
      if (urlParams.get('sheet')) localStorage.setItem('homework_sheet_url', urlParams.get('sheet'));

      if (urlParams.get('api')) {
        window.history.replaceState({}, document.title, window.location.pathname);
        alert('🎉 已根據專屬 Link 自動載入連線設定！');
      }
    }

    function copySystemUrl() {
      const currentPath = window.location.pathname;
      const directory = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
      const baseUrl = window.location.origin + directory + 'index.html';

      const api = localStorage.getItem('homework_system_api_url') || '';
      if (!api) { alert('請先設定 Web App URL！'); return; }

      const year = localStorage.getItem('homework_academic_year') || '2026-2027';
      const teacher = localStorage.getItem('homework_teacher_code') || '';
      const sheet = localStorage.getItem('homework_sheet_url') || '';

      const dedicatedUrl = `${baseUrl}?year=${encodeURIComponent(year)}&teacher=${encodeURIComponent(teacher)}&api=${encodeURIComponent(api)}&sheet=${encodeURIComponent(sheet)}`;
      navigator.clipboard.writeText(dedicatedUrl).then(() => alert('✅ 帶有專屬 Google Sheet 連結的專屬 Link 已成功複製！'));
    }

    let customHomeworkTypes = [];
    let selectedType = '';

    function loadHomeworkTypes() {
      const saved = localStorage.getItem('homework_custom_types');
      if (saved) customHomeworkTypes = JSON.parse(saved);
      if (customHomeworkTypes.length > 0 && !selectedType) {
        selectedType = customHomeworkTypes[0];
      }
      renderTypeButtons();
    }

    function saveHomeworkTypes() {
      localStorage.setItem('homework_custom_types', JSON.stringify(customHomeworkTypes));
    }

    function renderTypeButtons() {
      const container = document.getElementById('typeButtons');
      container.innerHTML = '';

      customHomeworkTypes.forEach((type, index) => {
        const badge = document.createElement('div');
        badge.className = `type-badge ${type === selectedType ? 'active' : ''}`;
        badge.innerHTML = `
          <span onclick="selectType('${type}')">${type}</span>
          <span class="type-action-btn" onclick="editType(event, ${index})">✏️</span>
          <span class="type-action-btn" onclick="deleteType(event, ${index})">❌</span>
        `;
        container.appendChild(badge);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'add-type-btn';
      addBtn.innerText = customHomeworkTypes.length === 0 ? '+ 新增第一個功課種類' : '+ 新增種類';
      addBtn.onclick = addNewType;
      container.appendChild(addBtn);

      document.getElementById('currentTypeText').innerText = selectedType || '未選擇';
    }

    function selectType(type) {
      selectedType = type;
      renderTypeButtons();
    }

    function addNewType() {
      const val = prompt('請輸入新功課種類名稱：');
      if (val && val.trim() !== '') {
        const trimmed = val.trim();
        if (!customHomeworkTypes.includes(trimmed)) {
          customHomeworkTypes.push(trimmed);
          selectedType = trimmed;
          saveHomeworkTypes();
          renderTypeButtons();
        }
      }
    }

    function editType(e, index) {
      e.stopPropagation();
      const oldVal = customHomeworkTypes[index];
      const newVal = prompt('請修改功課種類名稱：', oldVal);
      if (newVal && newVal.trim() !== '' && newVal.trim() !== oldVal) {
        const trimmed = newVal.trim();
        customHomeworkTypes[index] = trimmed;
        if (selectedType === oldVal) selectedType = trimmed;
        saveHomeworkTypes();
        renderTypeButtons();
      }
    }

    function deleteType(e, index) {
      e.stopPropagation();
      const target = customHomeworkTypes[index];
      if (confirm(`確定要刪除「${target}」功課種類嗎？`)) {
        customHomeworkTypes.splice(index, 1);
        if (selectedType === target) {
          selectedType = customHomeworkTypes.length > 0 ? customHomeworkTypes[0] : '';
        }
        saveHomeworkTypes();
        renderTypeButtons();
      }
    }

    let rawSubjectData = {};
    let currentSubject = '';
    let currentClass = '';
    let studentStates = {};
    let correctionUpdates = {}; // 儲存舊功課跟進狀態變更 { rowIndex: newStatus }

    window.onload = function() {
      applySavedTheme();
      checkAndImportUrlParams();

      document.getElementById('issueDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('checkDate').value = new Date().toISOString().split('T')[0];
      
      document.getElementById('displayYear').innerText = localStorage.getItem('homework_academic_year') || '2026-2027';
      document.getElementById('displayTeacher').innerText = localStorage.getItem('homework_teacher_code') || '未設定';

      loadHomeworkTypes();
      fetchInitialData();
    };

    function fetchInitialData() {
      const apiUrl = localStorage.getItem('homework_system_api_url');
      if (!apiUrl) return;

      const year = localStorage.getItem('homework_academic_year') || '2026-2027';
      const teacher = localStorage.getItem('homework_teacher_code') || '';

      const requestUrl = `${apiUrl}?action=getInitialData&academicYear=${encodeURIComponent(year)}&teacherCode=${encodeURIComponent(teacher)}`;

      fetch(requestUrl)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            rawSubjectData = res.data || {};
            if (res.spreadsheetUrl) {
              localStorage.setItem('homework_sheet_url', res.spreadsheetUrl);
            }
            renderSubjectSelect();
          }
        });
    }

    function renderSubjectSelect() {
      const select = document.getElementById('subjectSelect');
      select.innerHTML = '';
      const subjects = Object.keys(rawSubjectData);

      subjects.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub; opt.innerText = sub;
        select.appendChild(opt);
      });

      if (subjects.length > 0) {
        currentSubject = subjects[0];
        onSubjectChange();
      }
    }

    function onSubjectChange() {
      currentSubject = document.getElementById('subjectSelect').value;
      document.getElementById('currentSubjectText').innerText = currentSubject;
      renderClassTabs();
    }

    function renderClassTabs() {
      const tabGroup = document.getElementById('classTabGroup');
      tabGroup.innerHTML = '';

      const classesObj = rawSubjectData[currentSubject] || {};
      const classList = Object.keys(classesObj);

      if (classList.length === 0) {
        tabGroup.innerHTML = '<div style="color:#888;">該科目無班別紀錄。</div>';
        return;
      }

      classList.forEach(className => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${className === currentClass ? 'active' : ''}`;
        btn.innerText = className;
        btn.onclick = () => switchClass(className);
        tabGroup.appendChild(btn);
      });

      if (!currentClass || !classList.includes(currentClass)) {
        currentClass = classList[0];
      }

      switchClass(currentClass);
    }

    function switchClass(className) {
      currentClass = className;
      document.getElementById('currentClassText').innerText = className;

      const tabGroup = document.getElementById('classTabGroup');
      tabGroup.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === className);
      });

      renderStudentRows();
      fetchPendingCorrections(); // 載入該班別過往待改正/補交項目
    }

    /* 獲取待跟進的舊功課列表 */
    function fetchPendingCorrections() {
      const apiUrl = localStorage.getItem('homework_system_api_url');
      if (!apiUrl || !currentSubject || !currentClass) return;

      fetch(`${apiUrl}?action=getPendingCorrections&subject=${encodeURIComponent(currentSubject)}&classGroup=${encodeURIComponent(currentClass)}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            renderPendingCard(res.data || []);
          }
        });
    }

    function renderPendingCard(pendingList) {
      const card = document.getElementById('pendingCard');
      const container = document.getElementById('pendingListContainer');
      container.innerHTML = '';
      correctionUpdates = {};

      if (pendingList.length === 0) {
        card.style.display = 'none';
        return;
      }

      card.style.display = 'block';

      pendingList.forEach(item => {
        const row = document.createElement('div');
        row.className = 'pending-row';
        row.innerHTML = `
          <div>
            <strong>(${item.studentId}) ${item.studentName}</strong> 
            <span style="color:#666; font-size:0.9em;">[${item.issueDate}] ${item.type} - ${item.details}</span> 
            <span style="color:#d9534f; font-weight:bold;">(原狀態: ${item.status})</span>
          </div>
          <select onchange="onPendingStatusChange(${item.rowIndex}, this.value)" style="padding:4px 8px; border-radius:4px;">
            <option value="">-- 跟進狀態 --</option>
            <option value="已完成改正">已完成改正</option>
            <option value="已補交">已補交</option>
            <option value="欠改正">繼續欠改正</option>
          </select>
        `;
        container.appendChild(row);
      });
    }

    function onPendingStatusChange(rowIndex, newStatus) {
      if (newStatus) {
        correctionUpdates[rowIndex] = newStatus;
      } else {
        delete correctionUpdates[rowIndex];
      }
    }

    function renderStudentRows() {
      const container = document.getElementById('studentContainer');
      container.innerHTML = '';
      studentStates = {};

      const list = (rawSubjectData[currentSubject] || {})[currentClass] || [];

      if (list.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">該班別暫無學生名單。</div>';
        return;
      }

      list.forEach(student => {
        const id = typeof student === 'object' ? student.id : student;
        const name = typeof student === 'object' ? student.name : student;

        studentStates[id] = '全對';

        const row = document.createElement('div');
        row.className = 'student-row';
        row.innerHTML = `
          <div><strong>(${id}) ${name}</strong></div>
          <div class="status-group" id="statusGroup_${id}">
            <button class="status-btn active" data-status="全對" onclick="setStudentStatus('${id}', '全對')">全對</button>
            <button class="status-btn" data-status="欠日期" onclick="setStudentStatus('${id}', '欠日期')">欠日期</button>
            <button class="status-btn" data-status="要改正" onclick="setStudentStatus('${id}', '要改正')">要改正</button>
            <button class="status-btn" data-status="欠改正" onclick="setStudentStatus('${id}', '欠改正')">欠改正</button>
            <button class="status-btn" data-status="欠交" onclick="setStudentStatus('${id}', '欠交')">欠交</button>
            <button class="status-btn" data-status="缺席" onclick="setStudentStatus('${id}', '缺席')">缺席</button>
            <button class="status-btn" data-status="申請延期" onclick="setStudentStatus('${id}', '申請延期')">申請延期</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function setStudentStatus(id, status) {
      studentStates[id] = status;
      const group = document.getElementById(`statusGroup_${id}`);
      group.querySelectorAll('.status-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-status') === status));
    }

    function setAllStatus(status) {
      Object.keys(studentStates).forEach(id => setStudentStatus(id, status));
    }

    function submitHomework() {
      const apiUrl = localStorage.getItem('homework_system_api_url');
      if (!apiUrl) { alert('請先設定 API URL！'); return; }
      if (!selectedType) { alert('請先新增並選擇功課種類！'); return; }

      const correctionsArray = Object.keys(correctionUpdates).map(rIndex => ({
        rowIndex: parseInt(rIndex),
        newStatus: correctionUpdates[rIndex]
      }));

      const payload = {
        action: 'saveHomework',
        payload: {
          academicYear: localStorage.getItem('homework_academic_year') || '2026-2027',
          teacherCode: localStorage.getItem('homework_teacher_code') || '',
          subject: currentSubject,
          classGroup: currentClass,
          issueDate: document.getElementById('issueDate').value,
          checkDate: document.getElementById('checkDate').value,
          type: selectedType, // 功課種類
          pages: document.getElementById('pages').value,
          questions: document.getElementById('questions').value,
          students: Object.keys(studentStates).map(id => {
            const list = (rawSubjectData[currentSubject] || {})[currentClass] || [];
            const stObj = list.find(s => (typeof s === 'object' ? s.id : s) == id);
            const stName = typeof stObj === 'object' ? stObj.name : stObj;
            return { id: id, name: stName, status: studentStates[id] };
          }),
          corrections: correctionsArray // 舊功課改正更新列表
        }
      };

      fetch(apiUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => {
          alert('✅ 功課記錄與改正跟進已成功儲存！');
          fetchPendingCorrections(); // 重新整理跟進卡片
        });
    }
  </script>
</body>
</html>
