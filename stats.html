<!DOCTYPE html>
<html lang="zh-HANT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生功課欠交日數統計</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
      --accent-info: #f0f7ff;
      --base-font-size: 15px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--base-font-size);
      margin: 0; padding: 15px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      width: 96%; max-width: 1400px; margin: 0 auto;
      background: var(--card-bg); padding: 25px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { color: var(--primary-color); margin: 0; }

    .nav-btn-group { display: flex; gap: 8px; }

    .nav-btn {
      padding: 8px 14px; border-radius: 6px; font-weight: bold;
      cursor: pointer; background-color: #6c757d; color: white; border: none;
    }
    .btn-theme { background-color: var(--primary-color); }

    .filter-card {
      background: var(--accent-info); border: 1px solid var(--border-color);
      padding: 20px; border-radius: 10px; margin-bottom: 25px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
    }

    .filter-group { display: flex; flex-direction: column; }
    .filter-group label { font-weight: bold; margin-bottom: 6px; }
    .filter-group input, .filter-group select { padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); }

    .search-btn {
      grid-column: 1 / -1; background-color: var(--primary-color); color: white;
      border: none; padding: 12px; font-size: 1.05em; font-weight: bold;
      border-radius: 6px; cursor: pointer;
    }

    .data-table {
      width: 100%; border-collapse: collapse; margin-top: 15px;
    }

    .data-table th, .data-table td {
      border: 1px solid var(--border-color); padding: 10px; text-align: left;
    }

    .data-table th { background-color: var(--accent-info); color: var(--primary-color); }

    .badge-missing { background: #dc3545; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.85em; }
    .badge-fix { background: #ffc107; color: black; padding: 3px 8px; border-radius: 12px; font-size: 0.85em; }

    /* 個人化 Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-box {
      background: var(--card-bg); color: var(--text-color); padding: 25px; border-radius: 12px; width: 90%; max-width: 450px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2); border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>📊 學生功課欠交日數統計</h1>
      <div class="nav-btn-group">
        <button class="nav-btn btn-theme" onclick="openThemeModal()">🎨 個人化介面</button>
        <button class="nav-btn" onclick="navigateToHome()">⬅️ 返回主頁登記</button>
      </div>
    </div>

    <div class="filter-card">
      <div class="filter-group">
        <label for="startDate">開始日期：</label>
        <input type="date" id="startDate">
      </div>
      <div class="filter-group">
        <label for="endDate">結束日期：</label>
        <input type="date" id="endDate">
      </div>
      <div class="filter-group">
        <label for="subjectSelect">科目：</label>
        <select id="subjectSelect">
          <option value="ALL">全部科目</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="classSelect">班別：</label>
        <select id="classSelect">
          <option value="ALL">全部班別</option>
        </select>
      </div>
      <button class="search-btn" onclick="fetchStatsData()">🔍 查詢統計資料</button>
    </div>

    <h2>📈 欠交總計摘要</h2>
    <table class="data-table">
      <thead>
        <tr>
          <th>班別</th>
          <th>學號</th>
          <th>學生姓名</th>
          <th>欠交日數 (累計)</th>
          <th>要改正/欠改正次數</th>
        </tr>
      </thead>
      <tbody id="summaryTableBody">
        <tr><td colspan="5" style="text-align:center;">請點擊「查詢統計資料」載入數據。</td></tr>
      </tbody>
    </table>

    <h2 style="margin-top:35px;">📝 明細紀錄</h2>
    <table class="data-table">
      <thead>
        <tr>
          <th>日期</th>
          <th>科目</th>
          <th>班別</th>
          <th>學號與姓名</th>
          <th>功課種類與細項</th>
          <th>狀態</th>
        </tr>
      </thead>
      <tbody id="recordsTableBody">
        <tr><td colspan="6" style="text-align:center;">尚無明細記錄。</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 個人化設定 Modal (6 色 + 4 級字體) -->
  <div class="modal-overlay" id="themeModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0;">🎨 個人化介面設定</h3>
        <span onclick="closeThemeModal()" style="cursor:pointer; font-weight:bold;">✕</span>
      </div>
      <div class="form-group" style="margin-bottom:15px;">
        <label for="themeSelect">選取主題顏色：</label>
        <select id="themeSelect" style="padding:8px; border-radius:6px; margin-top:5px;">
          <option value="blue">藍色 (Blue - 預設)</option>
          <option value="orange">橙色 (Orange)</option>
          <option value="yellow">黃色 (Yellow)</option>
          <option value="green">綠色 (Green)</option>
          <option value="black">黑色 (Black / 深色模式)</option>
          <option value="purple">紫色 (Purple)</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <label for="fontSizeSelect">選取字體大小：</label>
        <select id="fontSizeSelect" style="padding:8px; border-radius:6px; margin-top:5px;">
          <option value="13px">小 (13px)</option>
          <option value="15px">標準 (15px)</option>
          <option value="18px">大字體 (18px)</option>
          <option value="21px">特大字體 (21px)</option>
        </select>
      </div>
      <button onclick="saveThemeSettings()" style="width:100%; padding:10px; background:var(--primary-color); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">💾 儲存並套用設定</button>
    </div>
  </div>

  <script>
    function applySavedTheme() {
      const theme = localStorage.getItem('homework_theme') || 'blue';
      const fontSize = localStorage.getItem('homework_font_size') || '15px';
      const root = document.documentElement;

      root.style.setProperty('--base-font-size', fontSize);

      if (theme === 'orange') {
        root.style.setProperty('--primary-color', '#e65100');
        root.style.setProperty('--bg-color', '#fff3e0');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--text-color', '#3e2723');
        root.style.setProperty('--border-color', '#ffe0b2');
        root.style.setProperty('--accent-info', '#fff8e1');
      } else if (theme === 'yellow') {
        root.style.setProperty('--primary-color', '#f57f17');
        root.style.setProperty('--bg-color', '#fffde7');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--text-color', '#332701');
        root.style.setProperty('--border-color', '#fff9c4');
        root.style.setProperty('--accent-info', '#fffde7');
      } else if (theme === 'green') {
        root.style.setProperty('--primary-color', '#2e7d32');
        root.style.setProperty('--bg-color', '#f1f8e9');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--text-color', '#1b5e20');
        root.style.setProperty('--border-color', '#c8e6c9');
        root.style.setProperty('--accent-info', '#e8f5e9');
      } else if (theme === 'black') {
        root.style.setProperty('--primary-color', '#4dabf7');
        root.style.setProperty('--bg-color', '#121212');
        root.style.setProperty('--card-bg', '#1e1e1e');
        root.style.setProperty('--text-color', '#e0e0e0');
        root.style.setProperty('--border-color', '#444444');
        root.style.setProperty('--accent-info', '#2a2a2a');
      } else if (theme === 'purple') {
        root.style.setProperty('--primary-color', '#6f42c1');
        root.style.setProperty('--bg-color', '#f3e8ff');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--text-color', '#3b0764');
        root.style.setProperty('--border-color', '#d8b4fe');
        root.style.setProperty('--accent-info', '#faf5ff');
      } else {
        root.style.setProperty('--primary-color', '#0056b3');
        root.style.setProperty('--bg-color', '#f4f7f9');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--text-color', '#333333');
        root.style.setProperty('--border-color', '#cccccc');
        root.style.setProperty('--accent-info', '#f0f7ff');
      }
    }

    function openThemeModal() {
      document.getElementById('themeSelect').value = localStorage.getItem('homework_theme') || 'blue';
      document.getElementById('fontSizeSelect').value = localStorage.getItem('homework_font_size') || '15px';
      document.getElementById('themeModal').style.display = 'flex';
    }

    function closeThemeModal() {
      document.getElementById('themeModal').style.display = 'none';
    }

    function saveThemeSettings() {
      const theme = document.getElementById('themeSelect').value;
      const fontSize = document.getElementById('fontSizeSelect').value;
      localStorage.setItem('homework_theme', theme);
      localStorage.setItem('homework_font_size', fontSize);
      applySavedTheme();
      closeThemeModal();
    }

    function navigateToHome() {
      const currentPath = window.location.pathname;
      const directory = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
      window.location.replace(window.location.origin + directory + 'index.html');
    }

    window.onload = function() {
      applySavedTheme();

      const today = new Date().toISOString().split('T')[0];
      const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      document.getElementById('startDate').value = thirtyDaysAgo;
      document.getElementById('endDate').value = today;

      fetchStatsData();
    };

    function fetchStatsData() {
      const apiUrl = localStorage.getItem('homework_system_api_url');
      if (!apiUrl) {
        alert('請先在設定頁面配置 Web App URL！');
        return;
      }

      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const subject = document.getElementById('subjectSelect').value;
      const classGroup = document.getElementById('classSelect').value;

      const url = `${apiUrl}?action=getStats&startDate=${startDate}&endDate=${endDate}&subject=${encodeURIComponent(subject)}&classGroup=${encodeURIComponent(classGroup)}`;

      fetch(url)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            updateFilterOptions(res.subjects || [], res.classes || []);
            renderSummaryTable(res.summary || []);
            renderRecordsTable(res.records || []);
          } else {
            alert('查詢失敗：' + res.message);
          }
        })
        .catch(err => {
          alert('連線錯誤：請確認 Web App 已發布為「新版本」且權限為「任何人」。');
        });
    }

    function updateFilterOptions(subjects, classes) {
      const subSelect = document.getElementById('subjectSelect');
      const clsSelect = document.getElementById('classSelect');

      const currentSub = subSelect.value;
      const currentCls = clsSelect.value;

      subSelect.innerHTML = '<option value="ALL">全部科目</option>';
      subjects.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.innerText = s;
        if (s === currentSub) opt.selected = true;
        subSelect.appendChild(opt);
      });

      clsSelect.innerHTML = '<option value="ALL">全部班別</option>';
      classes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.innerText = c;
        if (c === currentCls) opt.selected = true;
        clsSelect.appendChild(opt);
      });
    }

    function renderSummaryTable(summary) {
      const tbody = document.getElementById('summaryTableBody');
      tbody.innerHTML = '';

      if (summary.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">此期間無欠交記錄。</td></tr>';
        return;
      }

      summary.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.classGroup}</td>
          <td>${item.studentId}</td>
          <td><strong>${item.studentName}</strong></td>
          <td><span class="badge-missing">${item.missingDays} 天</span></td>
          <td><span class="badge-fix">${item.needFixCount} 次</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderRecordsTable(records) {
      const tbody = document.getElementById('recordsTableBody');
      tbody.innerHTML = '';

      if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">無明細記錄。</td></tr>';
        return;
      }

      records.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.date}</td>
          <td>${item.subject}</td>
          <td>${item.classGroup}</td>
          <td>(${item.studentId}) ${item.studentName}</td>
          <td>${item.type} - ${item.details}</td>
          <td><strong>${item.status}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>

</body>
</html>
