<!DOCTYPE html>
<html lang="zh-HANT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欠交日數統計 - 班級功課記錄系統</title>
  <style>
    /* 1. 全局 CSS 變數與主題設定 */
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
      --accent-info: #f0f7ff;
      --base-font-size: 15px;
    }

    body.theme-green {
      --primary-color: #2e7d32;
      --bg-color: #f1f8e9;
      --card-bg: #ffffff;
      --text-color: #1b5e20;
      --border-color: #c8e6c9;
      --accent-info: #e8f5e9;
    }

    body.theme-orange {
      --primary-color: #e65100;
      --bg-color: #fff3e0;
      --card-bg: #ffffff;
      --text-color: #bf360c;
      --border-color: #ffe0b2;
      --accent-info: #fff8e1;
    }

    body.theme-purple {
      --primary-color: #6a1b9a;
      --bg-color: #f3e5f5;
      --card-bg: #ffffff;
      --text-color: #4a148c;
      --border-color: #e1bee7;
      --accent-info: #f3e5f5;
    }

    body.theme-dark {
      --primary-color: #90caf9;
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --border-color: #424242;
      --accent-info: #2c2c2c;
    }

    body.font-small { --base-font-size: 13px; }
    body.font-medium { --base-font-size: 15px; }
    body.font-large { --base-font-size: 18px; }
    body.font-xlarge { --base-font-size: 20px; }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--base-font-size);
      margin: 0; padding: 15px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      width: 96%; max-width: 1400px; margin: 0 auto;
      background: var(--card-bg); padding: 25px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); transition: background-color 0.3s;
    }

    .header-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    h1 { color: var(--primary-color); margin: 0; font-size: 1.8em; }

    .header-btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .theme-toggle-btn, .nav-btn {
      padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 0.9em;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    }
    .theme-toggle-btn { background-color: #6a1b9a; color: white; border: none; }
    .nav-btn { background-color: #6c757d; color: white; border: none; }

    .filter-card {
      background: var(--accent-info); border: 1px solid var(--border-color);
      padding: 20px; border-radius: 10px; margin-bottom: 25px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
    }

    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-weight: bold; margin-bottom: 6px; font-size: 0.9em; }
    .form-group input, .form-group select {
      padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;
      font-size: 0.95em; background: var(--card-bg); color: var(--text-color);
    }

    .query-btn {
      grid-column: 1 / -1; background-color: var(--primary-color); color: white;
      border: none; padding: 12px; border-radius: 6px; font-size: 1em; font-weight: bold; cursor: pointer;
    }

    .stats-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .stats-table th, .stats-table td {
      border: 1px solid var(--border-color); padding: 10px; text-align: center; font-size: 0.9em;
    }
    .stats-table th { background-color: var(--accent-info); color: var(--primary-color); font-weight: bold; }

    /* Modal 浮動視窗 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-box {
      background: var(--card-bg); color: var(--text-color); padding: 25px; border-radius: 12px; max-width: 550px; width: 92%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; border: 1px solid var(--border-color);
    }
    .modal-header { font-size: 1.2em; font-weight: bold; color: var(--primary-color); margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
    .modal-close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.3em; cursor: pointer; border: none; background: none; color: var(--text-color); font-weight: bold; }

    .theme-option-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .theme-circle { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
    .font-size-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .font-btn { padding: 8px 16px; border: 1px solid var(--border-color); background: var(--accent-info); color: var(--text-color); border-radius: 6px; cursor: pointer; font-weight: bold; }
    .font-btn.active { background: var(--primary-color); color: white; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>📊 學生功課欠交日數統計</h1>
      <div class="header-btn-group">
        <button class="theme-toggle-btn" onclick="openThemeModal()">🎨 個人化介面</button>
        <a href="index.html" class="nav-btn">⬅️ 返回主頁登記</a>
      </div>
    </div>

    <div class="filter-card">
      <div class="form-group">
        <label for="startDate">開始日期：</label>
        <input type="date" id="startDate">
      </div>
      <div class="form-group">
        <label for="endDate">結束日期：</label>
        <input type="date" id="endDate">
      </div>
      <div class="form-group">
        <label for="subjectSelect">科目：</label>
        <select id="subjectSelect"><option value="ALL">全部科目</option></select>
      </div>
      <div class="form-group">
        <label for="classSelect">班別：</label>
        <select id="classSelect"><option value="ALL">全部班別</option></select>
      </div>
      <button class="query-btn" onclick="fetchStatsData()">🔍 查詢統計資料</button>
    </div>

    <div id="statsResultContainer">
      <div style="text-align: center; color: #888; padding: 20px;">請點擊「查詢統計資料」查看學生累積欠交天數。</div>
    </div>
  </div>

  <!-- 個人化設定 Modal (含特大字體) -->
  <div class="modal-overlay" id="themeModal">
    <div class="modal-box">
      <button class="modal-close-btn" onclick="closeModal('themeModal')">✖</button>
      <div class="modal-header">🎨 個人化介面設定</div>
      
      <h4>選擇主題色彩：</h4>
      <div class="theme-option-group">
        <div class="theme-circle" style="background:#0056b3;" onclick="setTheme('default')" title="經典藍">藍</div>
        <div class="theme-circle" style="background:#2e7d32;" onclick="setTheme('theme-green')" title="森林綠">綠</div>
        <div class="theme-circle" style="background:#e65100;" onclick="setTheme('theme-orange')" title="暖陽橙">橙</div>
        <div class="theme-circle" style="background:#6a1b9a;" onclick="setTheme('theme-purple')" title="極簡紫">紫</div>
        <div class="theme-circle" style="background:#121212;" onclick="setTheme('theme-dark')" title="暗黑模式">黑</div>
      </div>

      <h4>選擇字體大小：</h4>
      <div class="font-size-group">
        <button class="font-btn" id="fontSmallBtn" onclick="setFontSize('font-small')">小字體</button>
        <button class="font-btn" id="fontMediumBtn" onclick="setFontSize('font-medium')">標準</button>
        <button class="font-btn" id="fontLargeBtn" onclick="setFontSize('font-large')">大字體</button>
        <button class="font-btn" id="fontXLargeBtn" onclick="setFontSize('font-xlarge')">特大字體</button>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      loadPersonalizationSettings();

      const today = new Date().toISOString().split('T')[0];
      const monthAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      document.getElementById('startDate').value = monthAgo;
      document.getElementById('endDate').value = today;
    };

    function openThemeModal() { document.getElementById('themeModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function setTheme(themeName) {
      document.body.classList.remove('theme-green', 'theme-orange', 'theme-purple', 'theme-dark');
      if (themeName !== 'default') document.body.classList.add(themeName);
      localStorage.setItem('homework_theme', themeName);
    }

    function setFontSize(sizeClass) {
      document.body.classList.remove('font-small', 'font-medium', 'font-large', 'font-xlarge');
      document.body.classList.add(sizeClass);
      localStorage.setItem('homework_font_size', sizeClass);

      document.querySelectorAll('.font-btn').forEach(btn => btn.classList.remove('active'));
      if (sizeClass === 'font-small' && document.getElementById('fontSmallBtn')) document.getElementById('fontSmallBtn').classList.add('active');
      if (sizeClass === 'font-medium' && document.getElementById('fontMediumBtn')) document.getElementById('fontMediumBtn').classList.add('active');
      if (sizeClass === 'font-large' && document.getElementById('fontLargeBtn')) document.getElementById('fontLargeBtn').classList.add('active');
      if (sizeClass === 'font-xlarge' && document.getElementById('fontXLargeBtn')) document.getElementById('fontXLargeBtn').classList.add('active');
    }

    function loadPersonalizationSettings() {
      const savedTheme = localStorage.getItem('homework_theme') || 'default';
      const savedFontSize = localStorage.getItem('homework_font_size') || 'font-medium';
      setTheme(savedTheme);
      setFontSize(savedFontSize);
    }

    function fetchStatsData() {
      const apiUrl = localStorage.getItem('homework_system_api_url');
      if (!apiUrl) { alert('請先設定 Web App URL！'); return; }

      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const container = document.getElementById('statsResultContainer');
      container.innerHTML = '<div style="text-align: center; padding: 20px;">統計資料載入中...</div>';

      fetch(`${apiUrl}?action=getStatsData&startDate=${startDate}&endDate=${endDate}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            renderStatsTable(res.data);
          } else {
            container.innerHTML = '<div style="color:red; text-align:center;">載入失敗。</div>';
          }
        }).catch(err => {
          container.innerHTML = '<div style="color:red; text-align:center;">連線錯誤：' + err + '</div>';
        });
    }

    function renderStatsTable(data) {
      const container = document.getElementById('statsResultContainer');
      if (!data || data.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px;">該時段內無欠交紀錄。</div>';
        return;
      }

      let html = `
        <table class="stats-table">
          <thead>
            <tr>
              <th>學年</th>
              <th>科目</th>
              <th>班別</th>
              <th>學號</th>
              <th>姓名</th>
              <th>累積欠交天數</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.forEach(item => {
        html += `
          <tr>
            <td>${item.academicYear || '-'}</td>
            <td>${item.subject || '-'}</td>
            <td>${item.classGroup || '-'}</td>
            <td>${item.studentId}</td>
            <td>${item.studentName}</td>
            <td style="color:#dc3545; font-weight:bold;">${item.missingCount} 天</td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }
  </script>

</body>
</html>
